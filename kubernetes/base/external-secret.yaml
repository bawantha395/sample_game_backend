apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: game-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: game-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_PASS
      remoteRef:
        key: prod-game-db-credentials
        property: password

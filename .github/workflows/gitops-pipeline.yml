
  name: githubactions-pipeline

  on:
    push:
      branches:
        - prod
    workflow_dispatch:
      inputs:
        action:
          description: 'Choose action to perform'
          required: true
          default: 'deploy'
          type: choice
          options:
            - deploy
            - destroy
        environment:
          description: 'Environment to target'
          required: true
          default: 'prod'
          type: choice
          options:
            - dev
            - prod

  env:
    TARGET_ENV: ${{ github.event.inputs.environment || 'prod' }}
    TARGET_ACTION: ${{ github.event.inputs.action || 'deploy' }}

  jobs:
    # ==========================================
    # JOB 1: APPLICATION & INFRASTRUCTURE DEPLOY
    # ==========================================
    deploy-and-sync:
      name: Core Provision and Deploy
      runs-on: ubuntu-latest
      if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
      permissions:
        contents: write
      steps:
        - name: 1. Checkout Code Base
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: 2. Configure AWS Access
          id: aws-login
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: 3. Dynamic Pre-Flight S3 & DynamoDB Bootstrapping
          id: bootstrap
          run: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            BUCKET_NAME="game-app-tf-state-${ACCOUNT_ID}"
            TABLE_NAME="game-app-tf-locks"
            
            echo "using_bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
            echo "using_table=$TABLE_NAME" >> $GITHUB_OUTPUT
            
            if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
              aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
              aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
            fi
            
            if ! aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
              aws dynamodb create-table \
                --table-name "$TABLE_NAME" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region us-east-1
              aws dynamodb wait table-exists --table-name "$TABLE_NAME"
            fi

        - name: 4. Initialize Terraform Engine
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.5.0

        - name: 5. Execute Infrastructure Provisioning
          run: |
            cd terraform/environments/${{ env.TARGET_ENV }}
            terraform init \
              -backend-config="bucket=${{ steps.bootstrap.outputs.using_bucket }}" \
              -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.using_table }}" \
              -backend-config="key=${{ env.TARGET_ENV }}/terraform.tfstate"
            
            terraform plan
            terraform apply -auto-approve
          env:
            TF_VAR_db_username: ${{ env.TARGET_ENV == 'prod' && secrets.DB_USERNAME_PROD || secrets.DB_USERNAME_DEV }}
            TF_VAR_db_password: ${{ env.TARGET_ENV == 'prod' && secrets.DB_PASSWORD_PROD || secrets.DB_PASSWORD_DEV }}

        - name: 6. Extract Live Cloud Target Data
          id: cloud-data
          run: |
            cd terraform/environments/${{ env.TARGET_ENV }}
            RAW_DB=$(terraform output -raw database_endpoint)
            CLEAN_DB=$(echo $RAW_DB | cut -d':' -f1)
            RAW_ECR=$(terraform output -raw ecr_repository_url)
            echo "db_host=$CLEAN_DB" >> $GITHUB_OUTPUT
            echo "ecr_url=$RAW_ECR" >> $GITHUB_OUTPUT

        - name: 7. Inject Live Database Configurations
          run: |
            sed -i "s|RDS_ENDPOINT_PLACEHOLDER|${{ steps.cloud-data.outputs.db_host }}|g" kubernetes/environments/${{ env.TARGET_ENV }}/kustomization.yaml

        - name: 8. Authenticate Container Engine to AWS ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: 9. Build and Publish Application Image
          run: |
            IMAGE_TAG=${GITHUB_SHA::7}
            REGISTRY_URL=${{ steps.cloud-data.outputs.ecr_url }}
            docker build -t $REGISTRY_URL:$IMAGE_TAG .
            docker push $REGISTRY_URL:$IMAGE_TAG
            echo "FINAL_TAG=$IMAGE_TAG" >> $GITHUB_ENV

        - name: 10. Set Up Kustomize Controller
          uses: imranismail/setup-kustomize@v2

        - name: 11. Update Kubernetes Resource Blueprints
          run: |
            REGISTRY_URL=${{ steps.cloud-data.outputs.ecr_url }}
            cd kubernetes/environments/${{ env.TARGET_ENV }}
            kustomize edit set image YOUR_ECR_REPO_URL=$REGISTRY_URL:${{ env.FINAL_TAG }}

        - name: 12. Commit and Push Manifest Changes to Git
          run: |
            git config --global user.name "GitHub Actions Automation"
            git config --global user.email "actions@github.com"
            git add kubernetes/environments/${{ env.TARGET_ENV }}/kustomization.yaml
            git add kubernetes/environments/${{ env.TARGET_ENV }}/patch.yaml
            git diff-index --quiet HEAD || git commit -m "chore(gitops): auto-synced variables for ${{ env.TARGET_ENV }} environment [skip ci]"
            git push origin prod

    # ==========================================
    # JOB 2: SCORCHED-EARTH INFRASTRUCTURE DESTROY
    # ==========================================
    destroy-infrastructure:
      name: Destroy Infrastructure Ecosystem
      runs-on: ubuntu-latest
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
      steps:
        - name: 1. Checkout Code Base
          uses: actions/checkout@v4

        - name: 2. Configure AWS Access
          id: aws-login
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: 3. Dynamic Pre-Flight S3 Map Verification
          id: bootstrap
          run: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            echo "using_bucket=game-app-tf-state-${ACCOUNT_ID}" >> $GITHUB_OUTPUT
            echo "using_table=game-app-tf-locks" >> $GITHUB_OUTPUT

        - name: 4. Initialize Terraform Engine
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.5.0

        - name: 5. Execute Core Teardown
          run: |
            cd terraform/environments/${{ env.TARGET_ENV }}
            terraform init \
              -backend-config="bucket=${{ steps.bootstrap.outputs.using_bucket }}" \
              -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.using_table }}" \
              -backend-config="key=${{ env.TARGET_ENV }}/terraform.tfstate"
            
            echo "🗑️ Launching complete ecosystem destruction..."
            terraform destroy -auto-approve
          env:
            TF_VAR_db_username: ${{ env.TARGET_ENV == 'prod' && secrets.DB_USERNAME_PROD || secrets.DB_USERNAME_DEV }}
            TF_VAR_db_password: ${{ env.TARGET_ENV == 'prod' && secrets.DB_PASSWORD_PROD || secrets.DB_PASSWORD_DEV }}

        - name: 6. Run Post-Destroy Target Cleanup
          run: |
            echo "🧹 Sweeping active dependencies and logs missed by modules..."
            
            # Force delete your game container registry repositories if images lock them down
            ECR_REPOS=$(aws ecr describe-repositories --region us-east-1 --query "repositories[?contains(repositoryName, 'game-app-${{ env.TARGET_ENV }}')].repositoryName" --output text 2>/dev/null || echo "")
            for repo in $ECR_REPOS; do
              echo "  🗑️ Force deleting ECR repository: $repo"
              aws ecr delete-repository --repository-name $repo --force --region us-east-1 2>/dev/null || true
            done
            
            # Force clean CloudWatch logs generated by your cluster/application run
            LOG_GROUPS=$(aws logs describe-log-groups --region us-east-1 --query "logGroups[?contains(logGroupName, 'game-app-${{ env.TARGET_ENV }}')].logGroupName" --output text 2>/dev/null || echo "")
            for lg in $LOG_GROUPS; do
              echo "  🗑️ Removing cluster log group: $lg"
              aws logs delete-log-group --log-group-name $lg --region us-east-1 2>/dev/null || true
            done
            
            echo "✅ Teardown complete. Account billing stopped for ${{ env.TARGET_ENV }}."




apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: game-app-secrets
  namespace: game-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: game-app-db-secret
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: prod/game/db
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: prod/game/db
        property: password

  name: Core GitOps Pipeline

  on:
    push:
      branches:
        - prod
    workflow_dispatch:
      inputs:
        action:
          description: 'Choose action to perform'
          required: true
          default: 'deploy'
          type: choice
          options:
            - deploy
            - destroy
        environment:
          description: 'Environment to target'
          required: true
          default: 'prod'
          type: choice
          options:
            - dev
            - prod

  env:
    TARGET_ENV: ${{ github.event.inputs.environment || 'prod' }}
    TARGET_ACTION: ${{ github.event.inputs.action || 'deploy' }}

  jobs:
    orchestrate:
      name: Core Provision and Deploy
      runs-on: ubuntu-latest
      # CRITICAL FIX: Grants the runner explicit permission to push GitOps updates back to your repo
      permissions:
        contents: write
      steps:
        - name: 1. Checkout Code Base
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: 2. Configure AWS Access
          id: aws-login
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: 3. Dynamic Pre-Flight S3 & DynamoDB Bootstrapping
          id: bootstrap
          run: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
            BUCKET_NAME="game-app-tf-state-${ACCOUNT_ID}"
            TABLE_NAME="game-app-tf-locks"
            
            echo "using_bucket=$BUCKET_NAME" >> $GITHUB_OUTPUT
            echo "using_table=$TABLE_NAME" >> $GITHUB_OUTPUT
            
            # Check and Auto-Create S3 Bucket
            if ! aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
              echo "S3 State Bucket missing. Auto-provisioning: $BUCKET_NAME"
              aws s3api create-bucket --bucket "$BUCKET_NAME" --region us-east-1
              aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
              aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
            else
              echo "S3 State Bucket verified online."
            fi
            
            # Check and Auto-Create DynamoDB Lock Table
            if ! aws dynamodb describe-table --table-name "$TABLE_NAME" 2>/dev/null; then
              echo "DynamoDB Lock Table missing. Auto-provisioning: $TABLE_NAME"
              aws dynamodb create-table \
                --table-name "$TABLE_NAME" \
                --attribute-definitions AttributeName=LockID,AttributeType=S \
                --key-schema AttributeName=LockID,KeyType=HASH \
                --billing-mode PAY_PER_REQUEST \
                --region us-east-1
              aws dynamodb wait table-exists --table-name "$TABLE_NAME"
            else
              echo "DynamoDB State Locks verified online."
            fi

        - name: 4. Initialize Terraform Engine
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.5.0

        - name: 5. Execute Infrastructure Synchronization
          run: |
            cd terraform/environments/${{ env.TARGET_ENV }}
            
            terraform init \
              -backend-config="bucket=${{ steps.bootstrap.outputs.using_bucket }}" \
              -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.using_table }}" \
              -backend-config="key=${{ env.TARGET_ENV }}/terraform.tfstate"
            
            if [ "${{ env.TARGET_ACTION }}" = "destroy" ]; then
              echo "=== EXECUTING TERRAFORM DESTROY ==="
              terraform destroy -auto-approve
            else
              echo "=== EXECUTING TERRAFORM PLAN ==="
              terraform plan
              echo "=== EXECUTING TERRAFORM APPLY ==="
              terraform apply -auto-approve
            fi
          env:
            TF_VAR_db_username: ${{ env.TARGET_ENV == 'prod' && secrets.DB_USERNAME_PROD || secrets.DB_USERNAME_DEV }}
            TF_VAR_db_password: ${{ env.TARGET_ENV == 'prod' && secrets.DB_PASSWORD_PROD || secrets.DB_PASSWORD_DEV }}

        - name: 6. Extract Live Cloud Target Data
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          id: cloud-data
          run: |
            cd terraform/environments/${{ env.TARGET_ENV }}
            RAW_DB=$(terraform output -raw database_endpoint)
            CLEAN_DB=$(echo $RAW_DB | cut -d':' -f1)
            RAW_ECR=$(terraform output -raw ecr_repository_url)
            
            echo "db_host=$CLEAN_DB" >> $GITHUB_OUTPUT
            echo "ecr_url=$RAW_ECR" >> $GITHUB_OUTPUT

        - name: 7. Inject Live Database Configurations
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          run: |
            sed -i "s|RDS_ENDPOINT_PLACEHOLDER|${{ steps.cloud-data.outputs.db_host }}|g" kubernetes/environments/${{ env.TARGET_ENV }}/kustomization.yaml

        - name: 8. Authenticate Container Engine to AWS ECR
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: 9. Build and Publish Application Image
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          run: |
            IMAGE_TAG=${GITHUB_SHA::7}
            REGISTRY_URL=${{ steps.cloud-data.outputs.ecr_url }}
            
            docker build -t $REGISTRY_URL:$IMAGE_TAG .
            docker push $REGISTRY_URL:$IMAGE_TAG
            
            echo "FINAL_TAG=$IMAGE_TAG" >> $GITHUB_ENV

        - name: 10. Set Up Kustomize Controller
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          uses: imranismail/setup-kustomize@v2

        - name: 11. Update Kubernetes Resource Blueprints
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          run: |
            REGISTRY_URL=${{ steps.cloud-data.outputs.ecr_url }}
            cd kubernetes/environments/${{ env.TARGET_ENV }}
            kustomize edit set image YOUR_ECR_REPO_URL=$REGISTRY_URL:${{ env.FINAL_TAG }}

        - name: 12. Commit and Push Manifest Changes to Git
          if: ${{ env.TARGET_ACTION == 'deploy' }}
          run: |
            git config --global user.name "GitHub Actions Automation"
            git config --global user.email "actions@github.com"
            git add kubernetes/environments/${{ env.TARGET_ENV }}/kustomization.yaml
            git add kubernetes/environments/${{ env.TARGET_ENV }}/patch.yaml
            git diff-index --quiet HEAD || git commit -m "chore(gitops): auto-synced variables for ${{ env.TARGET_ENV }} environment [skip ci]"
            git push origin prod
  


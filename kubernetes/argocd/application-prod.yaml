apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/bawantha395/sample_game_backend.git'
    targetRevision: prod
    path: kubernetes/environments/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: game-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

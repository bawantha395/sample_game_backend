apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patch.yaml

configMapGenerator:
  - name: game-app-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=RDS_ENDPOINT_PLACEHOLDER
      - MYSQL_PORT=3306
      - MYSQL_DB=game_db
      - MYSQL_USER=admin
